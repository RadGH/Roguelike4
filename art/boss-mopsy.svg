  <path d="M64 30 C67 16 64 9 61 10 C58 11 58 22 59 30 Z" fill="#5d4d85"/>
  <!-- body -->
  <path d="M48 22 C70 22 82 40 82 58 C82 78 66 88 48 88 C30 88 14 78 14 58 C14 40 26 22 48 22 Z" fill="#4a3d6b"/>
  <path d="M48 26 C66 26 77 41 77 56 C77 50 68 34 48 34 C28 34 19 50 19 56 C19 41 30 26 48 26 Z" fill="#5d4d85"/>
