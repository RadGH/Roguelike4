  <rect x="46.5" y="68" width="3.5" height="5" rx="1" fill="#fff"/>
  <!-- paws -->
  <ellipse cx="28" cy="80" rx="7" ry="5" fill="#3d3260"/>
  <ellipse cx="68" cy="80" rx="7" ry="5" fill="#3d3260"/>
